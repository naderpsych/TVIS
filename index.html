<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TVIS">
<title>TVIS</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#101b32;color:#fff;font-family:system-ui,-apple-system,Arial,sans-serif}
button,a{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.home{min-height:100svh;display:flex;flex-direction:column;gap:20px;padding:max(24px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
h1{text-align:center;font-size:clamp(30px,5vw,54px);margin:0}
.grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.ch{border:3px solid #fff5;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;min-height:160px}
.ch:active{transform:scale(.97)}
.ch strong{font-size:clamp(80px,12vw,170px);font-weight:900;line-height:.9;direction:ltr}
.ch span{font-size:clamp(26px,3.5vw,44px);font-weight:800}
.c11{background:linear-gradient(160deg,#1175b1,#064468)}
.c12{background:linear-gradient(160deg,#7657e3,#332478)}
.c13{background:linear-gradient(160deg,#d44450,#7c1b28)}
.c24{background:linear-gradient(160deg,#e0912a,#7a4710)}
.watch{display:none;position:fixed;inset:0;background:#000;z-index:100}
.watch.on{display:block}
video{position:absolute;top:0;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));width:100%;height:calc(100% - 52px - env(safe-area-inset-bottom));object-fit:contain;background:#000}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;font-size:clamp(24px,3vw,36px);font-weight:800;padding:20px}
.msg.hide{display:none}
.msg button{background:#ffe183;color:#171c2a;border:0;border-radius:18px;padding:16px 28px;font-size:30px;font-weight:900}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:130;display:flex;gap:6px;align-items:stretch;padding:5px 8px max(5px,env(safe-area-inset-bottom));background:#000}
.bar button{border:2px solid #fff8;border-radius:12px;background:#223;height:42px;font-size:19px;font-weight:900;flex:1;padding:0}
.bar button.cur{background:#ffe183;color:#171c2a}
.bar .x{flex:0 0 70px;background:#b3261e;font-size:30px;line-height:1}
body.watching{overflow:hidden}
</style>
</head>
<body>
<main class="home">
  <h1>📺 TVIS</h1>
  <section class="grid">
    <button class="ch c11" data-ch="11"><strong>11</strong><span>כאן</span></button>
    <button class="ch c12" data-ch="12"><strong>12</strong><span>קשת</span></button>
    <button class="ch c13" data-ch="13"><strong>13</strong><span>רשת</span></button>
    <button class="ch c24" data-ch="24"><strong>24</strong><span>ערוץ 24</span></button>
  </section>
</main>
<section class="watch" id="watch">
  <video id="video" playsinline webkit-playsinline autoplay></video>
  <div class="msg" id="msg"><div id="msgText">השידור נפתח…</div><button id="play" hidden>▶ הפעלה</button></div>
  <div class="bar">
    <button class="x" id="close" aria-label="סגירה">✕</button>
    <button data-ch="11">כאן 11</button>
    <button data-ch="12">קשת 12</button>
    <button data-ch="13">רשת 13</button>
    <button data-ch="24">ערוץ 24</button>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
'use strict';
// "keshet" sources need a fresh ticket from Mako before each play.
const CH={
  '11':{sources:['https://r.il.cdn-redge.media/livehls/oil/kancdn-live/live/kan11/live.livx/playlist.m3u8','https://kancdn.medonecdn.net/livehls/oil/kancdn-live/live/kan11/live.livx/playlist.m3u8']},
  '12':{official:'https://www.mako.co.il/mako-vod-live-tv/VOD-6540b8dcb64fd31006.htm',keshet:'/stream/hls/live/2033791/k12/index.m3u8'},
  '13':{sources:['https://d18b0e6mopany4.cloudfront.net/out/v1/2f2bc414a3db4698a8e94b89eaf2da2a/index.m3u8','https://reshet.g-mana.live/media/4607e158-e4d4-4e18-9160-3dc3ea9bc677/mainManifest.m3u8']},
  '24':{keshet:'/direct/hls/live/2035340/ch24live/index.m3u8?as=1'}
};
const watch=document.getElementById('watch'),video=document.getElementById('video'),msg=document.getElementById('msg'),msgText=document.getElementById('msgText'),play=document.getElementById('play');
let hls=null,current='',token=0;

function say(t,showPlay){msgText.textContent=t;play.hidden=!showPlay;msg.classList.remove('hide')}
function stop(){if(hls){hls.destroy();hls=null}video.pause();video.removeAttribute('src');video.load()}

async function keshetUrl(path){
  const u='https://mass.mako.co.il/ClicksStatistics/entitlementsServicesV2.jsp?'+new URLSearchParams({et:'ngt',lp:path,rv:'AKAMAI'});
  const r=await (await fetch(u)).json();
  return 'https://mako-streaming.akamaized.net'+path+(path.includes('?')?'&':'?')+r.tickets[0].ticket;
}

function load(url){
  return new Promise((ok,fail)=>{
    stop();
    if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src=url;
      video.onloadedmetadata=()=>ok();video.onerror=()=>fail();
    }else if(window.Hls&&Hls.isSupported()){
      hls=new Hls();hls.loadSource(url);hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>ok());
      hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)fail()});
    }else fail();
    setTimeout(fail,12000);
  });
}

function goFull(){
  const f=watch.requestFullscreen||watch.webkitRequestFullscreen;
  if(f&&!document.fullscreenElement&&!document.webkitFullscreenElement){try{Promise.resolve(f.call(watch)).then(landscape).catch(()=>{})}catch(e){}}
  else landscape();
}
// Android Chrome only allows rotating while fullscreen; iPad/iPhone ignore it.
function landscape(){try{const o=screen.orientation;if(o&&o.lock)o.lock('landscape').catch(()=>{})}catch(e){}}

async function open(n){
  const c=CH[n];if(!c)return;
  current=n;const my=++token;
  document.querySelectorAll('.bar [data-ch]').forEach(b=>b.classList.toggle('cur',b.dataset.ch===n));
  watch.classList.add('on');document.body.classList.add('watching');goFull();
  say('השידור נפתח…');
  let urls=c.sources||[];
  if(c.keshet){try{urls=[await keshetUrl(c.keshet)]}catch(e){urls=[]}}
  for(const u of urls){
    if(my!==token)return;
    try{await load(u);break}catch(e){if(u===urls[urls.length-1])urls=null}
  }
  if(my!==token)return;
  if(!urls||!urls.length){
    if(c.official){say('הערוץ ייפתח באתר הרשמי');setTimeout(()=>{if(my===token)location.href=c.official},1200)}
    else say('השידור לא זמין כרגע. נסי ערוץ אחר');
    return;
  }
  try{await video.play();msg.classList.add('hide')}catch(e){say('',true)}
}

function close(){
  token++;current='';stop();
  watch.classList.remove('on');document.body.classList.remove('watching');
  try{screen.orientation.unlock()}catch(e){}
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
  else if(document.webkitFullscreenElement&&document.webkitExitFullscreen)document.webkitExitFullscreen();
}

document.querySelectorAll('[data-ch]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.ch)));
document.getElementById('close').addEventListener('click',close);
play.addEventListener('click',()=>{video.play().then(()=>msg.classList.add('hide')).catch(()=>{})});
video.addEventListener('playing',()=>msg.classList.add('hide'));
</script>
</body>
</html>
